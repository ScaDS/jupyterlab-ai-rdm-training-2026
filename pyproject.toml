# Guide (user-friendly):
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "jupyterlab-ai-data-stewards-dev"
version = "1.0.0"
description = "Development environment: participant packages plus Jupyter Book for building the site"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bia-bob",
  "fg-data-profiling>=4.19.1",
  "frictionless>=5.19.0",
  "ipykernel",
  "ipywidgets",
  "jupyter-book>=2",
  "jupyterlab",
  "matplotlib",
  "notebook",
  "numpy",
  "pandas",
  "pandera>=0.31.1",
  "python-dotenv",
  "requests",
  "seaborn",
  # Pinned setuptools needed for fg-data-profiling
  "setuptools<=81.0.0",
]
[tool.uv]
package = false
