# Guide (user-friendly):
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "jupyter-ai-rdm-training"
version = "1.0.0"
description = "Development environment: participant packages plus Jupyter Book for building the site"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bia-bob",
  "fg-data-profiling",
  "frictionless",
  "ipykernel",
  "ipywidgets",
  "jupyter-book>=2",
  "jupyterlab",
  "matplotlib",
  "notebook",
  "numpy",
  "pandas",
  "pandera",
  "python-dotenv",
  "requests",
  "seaborn",
  "stackview",
]
[tool.uv]
package = false
constraint-dependencies = ["fonttools<4.69"]